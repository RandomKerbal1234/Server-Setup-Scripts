server {
server_name cockpit.noadminabusearda.opik.net;

location / {

proxy_pass https://127.0.0.1:9090/;

proxy_ssl_verify off;

proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
}

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/noadminabusearda.opik.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/noadminabusearda.opik.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = cockpit.noadminabusearda.opik.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


listen 80;
server_name cockpit.noadminabusearda.opik.net;
    return 404; # managed by Certbot


}
