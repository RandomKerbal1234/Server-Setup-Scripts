server {
server_name noadminabusearda.opik.net;

location = / {
default_type text/html;
return 200 '

<html>
<head><title>Home Lab</title></head>
<body>
<h1>SigmaCentral</h1>
<ul>
<li><a href="/guac/">Guacamole</a></li>
<li><a href="https://cockpit.noadminabusearda.opik.net">Cockpit</a></li>
<li><a href="/bluemap/">Bluemap</a></li>
</ul>
</body>
</html>';
}

location /guac/ {
proxy_pass http://localhost:8080/guacamole/;
proxy_buffering off;
proxy_http_version 1.1;

proxy_set_header X-Forwarded_for $proxy_add_x_forwarded_for;
proxy_set_header Upgrade $http_update;
proxy_set_header Connection $http_connection;
proxy_set_header Host $host;

access_log off;
}


location /bluemap/ {
proxy_pass http://127.0.0.1:8100/;
proxy_ssl_verify off;
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";

proxy_buffering off;
}


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/noadminabusearda.opik.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/noadminabusearda.opik.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = noadminabusearda.opik.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


listen 80;
server_name noadminabusearda.opik.net;
    return 404; # managed by Certbot


}
